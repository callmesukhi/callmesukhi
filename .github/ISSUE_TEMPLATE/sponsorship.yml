name: ❤️ Sponsorship / Support
description: Inquire about sponsoring or supporting the work
title: "[Sponsorship]: "
labels: ["sponsorship"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for considering supporting this work! 
        
        I spend personal time turning painful internal IT workflows into reusable automation that other teams can adapt.
        
        Your support helps me create more boring-but-critical IT automation and release it openly.

  - type: dropdown
    id: support-type
    attributes:
      label: How would you like to support?
      options:
        - GitHub Sponsors (monthly/one-time)
        - Buy Me A Coffee
        - Corporate sponsorship
        - Other (please describe below)
    validations:
      required: true

  - type: textarea
    id: message
    attributes:
      label: Message (optional)
      description: Any additional context or questions about sponsorship?
      placeholder: "Example: Our company saved 100 hours/month using your automation. We'd like to sponsor ongoing development."
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        **Sponsorship Links:**
        - [GitHub Sponsors](https://github.com/sponsors/callmesukhi)
        - [Buy Me A Coffee](https://buymeacoffee.com/callmesukhi)
        
        If you have questions about corporate sponsorship or custom support arrangements, please describe them above.
